[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "turbodata"
version = "0.1.0"
description = "Python SDK for the turbodata (.td) container format. Read/write port of the Go reference implementation."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "msgpack>=1.0.5",
    "zstandard>=0.22.0",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["turbodata*"]
