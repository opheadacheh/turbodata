[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "turbodata"
version = "0.1.0"
description = "Python SDK for the turbodata (.td) container format. Read/write port of the Go reference implementation."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Wanjia He" }]
keywords = ["turbodata", "container-format", "timeseries", "robotics", "mcap", "msgpack", "zstd"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "msgpack>=1.0.5",
    "zstandard>=0.22.0",
]

[project.urls]
Homepage = "https://github.com/opheadacheh/turbodata"
Repository = "https://github.com/opheadacheh/turbodata"
Issues = "https://github.com/opheadacheh/turbodata/issues"

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["turbodata*"]
