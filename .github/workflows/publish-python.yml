name: Publish Python

# Triggered by pushing a `py-vX.Y.Z` tag. Publishing uses PyPI Trusted
# Publishing (OIDC) — no API token. The PyPI project must have a GitHub
# trusted publisher configured for workflow `publish-python.yml` and
# environment `pypi` (owner `opheadacheh`, repository `turbodata`).

on:
  push:
    tags: ["py-v*"]

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        working-directory: py
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: py/dist/
