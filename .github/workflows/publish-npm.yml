name: Publish npm

# Triggered by pushing a `ts-vX.Y.Z` tag. Uses npm Trusted Publishing
# (OIDC), configured for this workflow with no environment name.

on:
  push:
    tags: ["ts-v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Build and stage on npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - name: Install npm with staged publishing support
        run: npm install --global 'npm@^11.15.0'
      - name: Install, build, test, and stage
        working-directory: ts
        run: |
          npm ci
          npm run build
          npm test
          npm stage publish --provenance --access public
